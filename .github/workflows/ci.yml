name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # The video tier shells out to ffmpeg. Its tests skip without it, so
      # installing it here is what keeps that path actually covered.
      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install ffmpeg
          else
            sudo apt-get update && sudo apt-get install -y ffmpeg
          fi

      - name: Install
        run: uv sync --python ${{ matrix.python }} --extra byok --extra web

      - name: Test
        run: uv run pytest tests/ -v

      # The video tests skip themselves when ffmpeg is absent. A green run that
      # skipped them looks identical to one that passed them, so fail loudly.
      - name: Check the video tests were not silently skipped
        run: |
          uv run pytest tests/ -q -k "clip or extract_frames" | tee result.txt
          if grep -q "skipped" result.txt; then
            echo "::error::video-tier tests were skipped — ffmpeg is missing"
            exit 1
          fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Build
        run: uv build

      # SKILL.md is a data file, not a module. It has been silently dropped
      # from a wheel before in projects laid out like this, and the failure
      # only shows up when a user runs `mascotify install-skill`.
      # Data files have broken this twice: once missing from the wheel, once
      # added twice by a redundant force-include, which fails the build outright.
      - name: Verify the data files ship in the wheel
        run: |
          python -c "
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()
          need = ['assets/SKILL.md', 'web/static/index.html',
                  'web/static/app.css', 'web/static/app.js']
          for want in need:
              assert any(n.endswith(want) for n in names), (want, names)
          assert len(names) == len(set(names)), 'duplicate entries in wheel'
          print('all data files present, no duplicates')
          "

      - name: Install from the wheel and smoke-test the CLI
        run: |
          uv tool install --force dist/*.whl
          mascotify --version
          mascotify motions
          mascotify --help

      # The web UI is served from package data, so it only proves out from an
      # installed wheel — running it from the source tree hides a packaging bug.
      - name: Smoke-test the web app from the installed wheel
        run: |
          uv tool install --force "dist/$(ls dist | grep whl)[web]"
          mascotify serve --no-open --port 8799 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8799/api/config > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8799/ | grep -q mascotify
          curl -sf http://127.0.0.1:8799/app.css > /dev/null
          curl -sf http://127.0.0.1:8799/api/config | grep -q has_anchor
          echo "web app serves from the wheel"
